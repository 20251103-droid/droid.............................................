<!-- contact.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲街 · 聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🎮 遊戲街</a>
      <ul class="nav-menu">
        <li><a href="index.html">首頁</a></li>
        <li><a href="products.html">產品介紹</a></li>
        <li><a href="contact.html" class="active">聯絡我們</a></li>
      </ul>
    </div>
  </nav>

  <!-- 主要內容 -->
  <main>
    <section class="page-header">
      <h1>聯絡我們</h1>
      <p>有任何問題或建議，歡迎隨時與我們聯繫</p>
    </section>

    <section class="contact-section">
      <div class="contact-grid">
        <!-- 聯絡資訊 -->
        <div class="contact-info">
          <h2>聯絡資訊</h2>
          <div class="info-item">
            <span class="info-icon">📍</span>
            <div>
              <h3>地址</h3>
              <p>香港九龍旺角遊戲街 100 號</p>
            </div>
          </div>
          <div class="info-item">
            <span class="info-icon">📞</span>
            <div>
              <h3>電話</h3>
              <p>+852 1234 5678</p>
            </div>
          </div>
          <div class="info-item">
            <span class="info-icon">✉️</span>
            <div>
              <h3>電子郵件</h3>
              <p><a href="mailto:20251103@blwc.edu.hk">20251103@blwc.edu.hk</a></p>
            </div>
          </div>
          <div class="info-item">
            <span class="info-icon">🕒</span>
            <div>
              <h3>營業時間</h3>
              <p>週一至週日 10:00 – 22:00</p>
            </div>
          </div>
        </div>

        <!-- 聯絡表單 -->
        <div class="contact-form-wrapper">
          <h2>傳送訊息</h2>
          <form id="contactForm">
            <div class="form-group">
              <label for="name">姓名</label>
              <input type="text" id="name" name="name" placeholder="請輸入您的姓名" required>
            </div>
            <div class="form-group">
              <label for="email">電子郵件</label>
              <input type="email" id="email" name="email" placeholder="請輸入您的電子郵件" required>
            </div>
            <div class="form-group">
              <label for="message">訊息</label>
              <textarea id="message" name="message" rows="5" placeholder="請輸入您的訊息..." required></textarea>
            </div>
            <button type="submit" class="btn-primary">送出訊息</button>
            <p id="formFeedback" class="form-feedback"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- 頁尾 -->
  <footer>
    <div class="footer-container">
      <p>© 2025 遊戲街 · 香港九龍旺角遊戲街 100 號</p>
      <p>電話：+852 1234 5678 · 電子郵件：<a href="mailto:20251103@blwc.edu.hk">20251103@blwc.edu.hk</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
